name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel a superseded run on the same branch/PR instead of letting it finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only on purpose: a pull request from a fork gets a read-only token
# anyway, so nothing here needs to write (the test report goes to each job's
# summary page, which needs no permission).
permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Safety net: a hung/looping test should fail the job quickly instead of
    # burning the runner's full time allotment. The framework has no
    # in-process per-test timeout of its own yet; this is a coarse stand-in
    # for CI specifically.
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC)
            os: windows-latest
            generator: ""
            build_args: "--config Release"
            exe_path: build/bin/Release/ASWUnitTests.exe
            gui_exe_path: build/bin/Release/ASWUnitTests_Win32_GUI.exe
          - name: Windows (MinGW)
            os: windows-latest
            generator: "MinGW Makefiles"
            build_args: ""
            exe_path: build/bin/ASWUnitTests.exe
            gui_exe_path: build/bin/ASWUnitTests_Win32_GUI.exe
          - name: Linux (GCC)
            os: ubuntu-latest
            generator: ""
            build_args: ""
            exe_path: build/bin/ASWUnitTests
            cc: gcc
            cxx: g++
          - name: Linux (Clang)
            os: ubuntu-latest
            generator: ""
            build_args: ""
            exe_path: build/bin/ASWUnitTests
            cc: clang
            cxx: clang++
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up MinGW
        if: matrix.generator == 'MinGW Makefiles'
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}"
            export CXX="${{ matrix.cxx }}"
          fi
          if [ -n "${{ matrix.generator }}" ]; then
            cmake -S cmake -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        shell: bash
        # Four jobs, one per core of a hosted runner. The Windows jobs build the Win32 GUI runner too, which
        # compiles the self-tests again; built one file at a time, that would take the MinGW job close to its
        # timeout. A bare --parallel would let make start a compiler for every file at once.
        run: |
          cmake --build build ${{ matrix.build_args }} --parallel 4
          if [ $? -ne 0 ]; then
            echo "Build failed!"
            exit 1
          fi

      - name: Verify executable exists
        shell: bash
        run: |
          if [ ! -f "${{ matrix.exe_path }}" ]; then
            echo "ERROR: Executable not found at ${{ matrix.exe_path }}"
            echo "Contents of build directory:"
            find build -type f -name "*.exe" 2>/dev/null || echo "No .exe files found"
            exit 1
          fi

      - name: Run self-tests
        id: tests
        shell: bash
        # --test-timeout-seconds and --catch-crashes are both defense-in-depth safety nets here: if
        # a test ever regresses into a genuine hang or a native crash (rather than failing
        # normally), this turns that into a clean, reported failure instead of relying solely on
        # the job's own timeout-minutes, or an opaque crashed job, to eventually notice.
        run: >-
          ./${{ matrix.exe_path }} --project-name "ASWUnitTests-CI" --report-junit junit-results.xml
          --test-timeout-seconds 60 --catch-crashes

      - name: Test results summary
        # Runs whenever the tests ran, pass or fail, so failures show up in
        # the report too. In this mode the reporter only writes this job's
        # summary page and makes no GitHub API calls, so it also works for
        # pull requests from forks, whose token is read-only. Also a wiring
        # smoke test for --report-junit itself: unit tests already cover
        # TJUnitReportWriter directly, but not that main.cpp actually calls
        # it when the flag is passed, so a missing or unreadable report after
        # the tests ran fails this step.
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: dorny/test-reporter@v3
        with:
          name: Test Results - ${{ matrix.name }}
          path: junit-results.xml
          reporter: java-junit
          use-actions-summary: true

      - name: Upload test results
        # Keeps the JUnit report as a downloadable artifact of the run.
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: junit-results.xml
          if-no-files-found: error

      - name: Run self-tests (partitioned)
        # Wiring smoke test for --partition-index/--partition-count: the
        # partition math itself is already unit-tested directly, but this
        # confirms main.cpp actually wires the flags through and that running
        # every partition still adds up to a full, passing suite.
        shell: bash
        run: |
          ./${{ matrix.exe_path }} --project-name "ASWUnitTests-CI-Partition1" --partition-index 1 --partition-count 2
          ./${{ matrix.exe_path }} --project-name "ASWUnitTests-CI-Partition2" --partition-index 2 --partition-count 2

      - name: Run self-tests in the Win32 GUI
        # Smoke test for the Win32 GUI runner (Windows jobs only): it opens its window, runs every test (--run),
        # writes the same JUnit report as the console runner, then closes and exits with the console runner's
        # exit code (--exit). Bash waits for a GUI program to end, unlike a Windows command prompt. The step's
        # own timeout ends a GUI left waiting on a dialog that nobody can close, rather than leaving it to the
        # job's.
        if: matrix.gui_exe_path != ''
        id: gui_tests
        timeout-minutes: 3
        shell: bash
        run: |
          if [ ! -f "${{ matrix.gui_exe_path }}" ]; then
            echo "ERROR: Executable not found at ${{ matrix.gui_exe_path }}"
            exit 1
          fi
          ./${{ matrix.gui_exe_path }} --project-name "ASWUnitTests-CI-Win32GUI" --run --exit \
            --report-junit gui-results.xml --test-timeout-seconds 60 --catch-crashes

      - name: Check the Win32 GUI's report
        # The GUI ran the same tests as the console runner, so both reports list the same number.
        if: matrix.gui_exe_path != ''
        shell: bash
        run: |
          console=$(grep -o '<testcase ' junit-results.xml | wc -l)
          gui=$(grep -o '<testcase ' gui-results.xml | wc -l)
          echo "Console runner: $console tests, Win32 GUI runner: $gui tests"
          if [ "$gui" -eq 0 ] || [ "$gui" -ne "$console" ]; then
            echo "ERROR: The Win32 GUI's report doesn't list the same tests as the console runner's"
            exit 1
          fi

      - name: Win32 GUI test results summary
        # As for the console runner's report above.
        if: ${{ matrix.gui_exe_path != '' && !cancelled() && steps.gui_tests.outcome != 'skipped' }}
        uses: dorny/test-reporter@v3
        with:
          name: Win32 GUI Test Results - ${{ matrix.name }}
          path: gui-results.xml
          reporter: java-junit
          use-actions-summary: true

      - name: Upload Win32 GUI test results
        if: ${{ matrix.gui_exe_path != '' && !cancelled() && steps.gui_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: gui-test-results-${{ matrix.name }}
          path: gui-results.xml
          if-no-files-found: error
